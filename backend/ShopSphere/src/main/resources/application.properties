spring.application.name=ShopSphere

#


spring.application.name=ShopSphere

# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/shopsphere}
spring.datasource.username=${DATABASE_USERNAME:shopsphere_user}
spring.datasource.password=${DATABASE_PASSWORD:}

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# SERVER
# =========================================================
server.port=${PORT:8080}

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}

# =========================================================
# EMAIL
# =========================================================
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}

# =========================================================
# TWILIO / SMS
# =========================================================
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

# =========================================================
# DISPOSABLE EMAIL VALIDATION
# =========================================================
disposable.email.api.url=${DISPOSABLE_EMAIL_API_URL:}
disposable.email.api.key=${DISPOSABLE_EMAIL_API_KEY:}

# =========================================================
# LOGGING
# =========================================================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
