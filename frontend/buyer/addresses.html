<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MARTplus | My Addresses</title>

    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>
        body {
            background: #f8fafc;
        }

        .address-page {
            min-height: 100vh;
        }

        /* Header */
        .dashboard-header {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
        }

        .dashboard-header-inner {
            max-width: 1400px;
            margin: auto;
            padding: 16px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dashboard-logo {
            color: #111827;
            text-decoration: none;
            font-size: 25px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .dashboard-logo-img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            border-radius: 9px;
            display: block;
        }

        .dashboard-logo span {
            color: #635bff;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .continue-shopping {
            color: #4b5563;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 9px 14px;
            border-radius: 9px;
        }

        .continue-shopping:hover {
            background: #f3f4f6;
            color: #635bff;
        }

        .header-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #ede9fe;
            color: #635bff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        /* Layout */
        .address-layout {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
            display: grid;
            grid-template-columns: 230px 1fr;
            gap: 30px;
        }

        /* Sidebar */
        .sidebar {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 12px;
            height: fit-content;
            position: sticky;
            top: 25px;
        }

        .sidebar-title {
            padding: 12px;
            color: #9ca3af;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .sidebar-nav a,
        .logout-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 13px;
            border-radius: 10px;
            text-decoration: none;
            color: #4b5563;
            font-size: 13px;
            font-weight: 600;
        }

        .sidebar-nav a:hover {
            background: #f5f3ff;
            color: #635bff;
        }

        .sidebar-nav a.active {
            background: #ede9fe;
            color: #635bff;
        }

        .sidebar-divider {
            height: 1px;
            background: #f0f0f0;
            margin: 10px 5px;
        }

        .logout-btn {
            width: 100%;
            border: none;
            background: transparent;
            cursor: pointer;
            color: #dc2626;
        }

        .logout-btn:hover {
            background: #fef2f2;
        }

        /* Content */
        .address-content {
            min-width: 0;
        }

        .page-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-heading h1 {
            margin: 0 0 7px;
            color: #111827;
            font-size: 30px;
            letter-spacing: -.7px;
        }

        .page-heading p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .add-address-btn {
            height: 42px;
            padding: 0 17px;
            border: none;
            border-radius: 9px;
            background: #635bff;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .add-address-btn:hover {
            background: #5149e8;
        }

        /* Address Grid */
        .address-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .address-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 20px;
            position: relative;
            transition: .2s ease;
        }

        .address-card:hover {
            border-color: #c7c3ff;
            box-shadow: 0 8px 25px rgba(17, 24, 39, .05);
        }

        .address-card.default {
            border-color: #8b85ff;
            box-shadow: 0 0 0 1px rgba(99, 91, 255, .08);
        }

        .address-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .address-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #111827;
            font-size: 14px;
            font-weight: 800;
        }

        .address-icon {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: #f5f3ff;
            color: #635bff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .default-badge {
            padding: 5px 8px;
            border-radius: 20px;
            background: #ecfdf5;
            color: #047857;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .address-name {
            color: #111827;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .address-text {
            color: #6b7280;
            font-size: 12px;
            line-height: 1.7;
        }

        .address-phone {
            margin-top: 8px;
            color: #4b5563;
            font-size: 12px;
            font-weight: 600;
        }

        .address-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 17px;
            padding-top: 14px;
            border-top: 1px solid #f0f0f0;
        }

        .address-action {
            border: 1px solid #e5e7eb;
            background: #fff;
            color: #4b5563;
            border-radius: 7px;
            padding: 7px 10px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .address-action:hover {
            border-color: #635bff;
            color: #635bff;
        }

        .address-action.delete:hover {
            border-color: #fecaca;
            color: #dc2626;
            background: #fef2f2;
        }

        .address-action.default-action {
            border-color: #c7d2fe;
            color: #4f46e5;
        }

        /* Empty */
        .empty-state {
            display: none;
            background: #fff;
            border: 1px dashed #d1d5db;
            border-radius: 15px;
            padding: 55px 25px;
            text-align: center;
        }

        .empty-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #f5f3ff;
            color: #635bff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .empty-state h3 {
            margin: 0 0 7px;
            color: #111827;
            font-size: 18px;
        }

        .empty-state p {
            margin: 0;
            color: #9ca3af;
            font-size: 12px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(17, 24, 39, .5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .address-modal {
            width: min(650px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, .2);
        }

        .modal-header {
            padding: 20px 22px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            margin: 0;
            color: #111827;
            font-size: 18px;
        }

        .close-modal {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: #f3f4f6;
            color: #4b5563;
            cursor: pointer;
            font-size: 16px;
        }

        .modal-body {
            padding: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            color: #374151;
            font-size: 11px;
            font-weight: 700;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            outline: none;
            padding: 10px 12px;
            color: #111827;
            background: #fff;
            font-family: inherit;
            font-size: 12px;
        }

        .form-input,
        .form-select {
            height: 42px;
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #635bff;
            box-shadow: 0 0 0 3px rgba(99, 91, 255, .08);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .checkbox-row input {
            accent-color: #635bff;
        }

        .checkbox-row label {
            color: #4b5563;
            font-size: 11px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #f0f0f0;
        }

        .modal-btn {
            height: 40px;
            padding: 0 15px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-btn.cancel {
            background: #fff;
            border: 1px solid #d1d5db;
            color: #4b5563;
        }

        .modal-btn.save {
            background: #635bff;
            border: 1px solid #635bff;
            color: #fff;
        }

        /* Toast */
        .address-toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            z-index: 2000;
            background: #111827;
            color: #fff;
            padding: 12px 17px;
            border-radius: 9px;
            font-size: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: .25s ease;
        }

        .address-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 950px) {
            .address-layout {
                display: block;
                padding: 20px;
            }

            .sidebar {
                position: static;
                margin-bottom: 20px;
            }

            .sidebar-nav {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
            }

            .sidebar-title,
            .sidebar-divider,
            .logout-btn {
                display: none;
            }

            .sidebar-nav a {
                justify-content: center;
                flex-direction: column;
                gap: 5px;
                text-align: center;
                font-size: 10px;
            }
        }

        @media (max-width: 700px) {
            .address-grid {
                grid-template-columns: 1fr;
            }

            .page-heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .add-address-btn {
                width: 100%;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }

        @media (max-width: 600px) {
            .dashboard-header-inner {
                padding: 13px 16px;
            }

            .continue-shopping {
                display: none;
            }

            .address-layout {
                padding: 15px;
            }

            .page-heading h1 {
                font-size: 25px;
            }
        }

        @media (max-width: 430px) {
            .sidebar-nav {
                grid-template-columns: repeat(3, 1fr);
            }

            .modal-body {
                padding: 17px;
            }

            .modal-actions {
                flex-direction: column-reverse;
            }

            .modal-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="address-page">

    <!-- Header -->

    <header class="dashboard-header">

        <div class="dashboard-header-inner">

            <a
                href="../index.html"
                class="dashboard-logo"
            >
                <img src="../assets/icons/mplus-logo.png" alt="MARTplus" class="dashboard-logo-img">
                <span>MART<span style="color: #635bff;">plus</span></span>
            </a>

            <div class="header-actions">

                <a
                    href="../products.html"
                    class="continue-shopping"
                >
                    ← Continue Shopping
                </a>

                <div
                    class="header-avatar"
                    id="headerAvatar"
                >
                    U
                </div>

            </div>

        </div>

    </header>


    <!-- Layout -->

    <div class="address-layout">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-title">
                My Account
            </div>

            <nav class="sidebar-nav">

                <a href="dashboard.html">
                    📊 Dashboard
                </a>

                <a href="orders.html">
                    📦 My Orders
                </a>

                <a href="tracking.html">
                    🚚 Track Order
                </a>

                <a href="profile.html">
                    👤 Profile
                </a>

                <a
                    href="addresses.html"
                    class="active"
                >
                    📍 Addresses
                </a>

                <a href="payments.html">
                    💳 Payments
                </a>

                <a href="../wishlist.html">
                    ❤️ Wishlist
                </a>

                <a href="../cart.html">
                    🛒 Cart
                </a>

            </nav>

            <div class="sidebar-divider"></div>

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                ↪️ Logout
            </button>

        </aside>


        <!-- Content -->

        <main class="address-content">

            <section class="page-heading">

                <div>
                    <h1>My Addresses</h1>

                    <p>
                        Manage your delivery addresses.
                    </p>
                </div>

                <button
                    class="add-address-btn"
                    id="addAddressBtn"
                >
                    + Add New Address
                </button>

            </section>


            <div
                class="address-grid"
                id="addressGrid"
            ></div>


            <div
                class="empty-state"
                id="emptyState"
            >

                <div class="empty-icon">
                    📍
                </div>

                <h3>
                    No addresses saved
                </h3>

                <p>
                    Add an address to make checkout faster.
                </p>

            </div>

        </main>

    </div>

</div>


<!-- Address Modal -->

<div
    class="modal-overlay"
    id="addressModal"
>

    <div class="address-modal">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add New Address
            </h2>

            <button
                class="close-modal"
                id="closeModalBtn"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <form id="addressForm">

                <input
                    type="hidden"
                    id="addressId"
                >

                <div class="form-grid">

                    <div class="form-group">

                        <label for="addressLabel">
                            Address Type
                        </label>

                        <select
                            id="addressLabel"
                            class="form-select"
                        >
                            <option value="Home">
                                Home
                            </option>

                            <option value="Work">
                                Work
                            </option>

                            <option value="Other">
                                Other
                            </option>
                        </select>

                    </div>


                    <div class="form-group">

                        <label for="recipientName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="recipientName"
                            class="form-input"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            class="form-input"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="pincode">
                            PIN Code
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            class="form-input"
                            placeholder="6 digit PIN"
                            maxlength="6"
                            required
                        >

                    </div>


                    <div class="form-group full">

                        <label for="addressLine">
                            Address
                        </label>

                        <textarea
                            id="addressLine"
                            class="form-textarea"
                            placeholder="House no., street, area"
                            required
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            class="form-input"
                            placeholder="City"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="state">
                            State
                        </label>

                        <input
                            type="text"
                            id="state"
                            class="form-input"
                            placeholder="State"
                            required
                        >

                    </div>


                    <div class="form-group full">

                        <div class="checkbox-row">

                            <input
                                type="checkbox"
                                id="isDefault"
                            >

                            <label for="isDefault">
                                Make this my default delivery address
                            </label>

                        </div>

                    </div>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="modal-btn cancel"
                        id="cancelModalBtn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="modal-btn save"
                    >
                        Save Address
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<div
    class="address-toast"
    id="addressToast"
></div>


<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/buyer.js"></script>

<script>

    const ADDRESS_KEY =
        "shopsphere_addresses";

    const AUTH_KEY =
        "shopsphere_user";


    const addressGrid =
        document.getElementById(
            "addressGrid"
        );

    const emptyState =
        document.getElementById(
            "emptyState"
        );

    const modal =
        document.getElementById(
            "addressModal"
        );

    const addressForm =
        document.getElementById(
            "addressForm"
        );


    /* ================================
       Storage
    ================================= */

    function getAddresses() {

        try {

            const data =
                JSON.parse(
                    localStorage.getItem(
                        ADDRESS_KEY
                    ) || "[]"
                );

            return Array.isArray(data)
                ? data
                : [];

        } catch (error) {

            return [];

        }

    }


    function saveAddresses(addresses) {

        localStorage.setItem(
            ADDRESS_KEY,
            JSON.stringify(addresses)
        );

    }


    /* ================================
       User
    ================================= */

    function getUser() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    AUTH_KEY
                ) || "null"
            );

        } catch (error) {

            return null;

        }

    }


    /* ================================
       Escape HTML
    ================================= */

    function escapeHtml(value) {

        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* ================================
       Toast
    ================================= */

    let toastTimer;

    function showToast(message) {

        const toast =
            document.getElementById(
                "addressToast"
            );

        toast.textContent =
            message;

        toast.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer =
            setTimeout(
                function () {

                    toast.classList.remove(
                        "show"
                    );

                },
                2200
            );

    }


    /* ================================
       Render
    ================================= */

    function renderAddresses() {

        const addresses =
            getAddresses();

        addressGrid.innerHTML = "";


        if (!addresses.length) {

            addressGrid.style.display =
                "none";

            emptyState.style.display =
                "block";

            return;

        }


        addressGrid.style.display =
            "grid";

        emptyState.style.display =
            "none";


        addresses.forEach(
            function (address) {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    `address-card ${
                        address.isDefault
                            ? "default"
                            : ""
                    }`;


                card.innerHTML = `

                    <div class="address-top">

                        <div class="address-label">

                            <span class="address-icon">
                                ${
                                    address.label === "Work"
                                        ? "💼"
                                        : address.label === "Other"
                                            ? "📌"
                                            : "🏠"
                                }
                            </span>

                            ${escapeHtml(address.label)}

                        </div>

                        ${
                            address.isDefault
                                ? `
                                    <span class="default-badge">
                                        Default
                                    </span>
                                `
                                : ""
                        }

                    </div>


                    <div class="address-name">
                        ${escapeHtml(address.name)}
                    </div>


                    <div class="address-text">

                        ${escapeHtml(address.address)}

                        <br>

                        ${escapeHtml(address.city)},
                        ${escapeHtml(address.state)}
                        -
                        ${escapeHtml(address.pincode)}

                    </div>


                    <div class="address-phone">
                        📞 ${escapeHtml(address.phone)}
                    </div>


                    <div class="address-actions">

                        <button
                            class="address-action edit-address"
                            data-id="${address.id}"
                        >
                            Edit
                        </button>

                        ${
                            !address.isDefault
                                ? `
                                    <button
                                        class="address-action default-action make-default"
                                        data-id="${address.id}"
                                    >
                                        Make Default
                                    </button>
                                `
                                : ""
                        }

                        <button
                            class="address-action delete delete-address"
                            data-id="${address.id}"
                        >
                            Delete
                        </button>

                    </div>

                `;


                addressGrid.appendChild(
                    card
                );

            }
        );

    }


    /* ================================
       Modal
    ================================= */

    function openModal(address = null) {

        addressForm.reset();

        document.getElementById(
            "addressId"
        ).value =
            address
                ? address.id
                : "";


        document.getElementById(
            "modalTitle"
        ).textContent =
            address
                ? "Edit Address"
                : "Add New Address";


        if (address) {

            document.getElementById(
                "addressLabel"
            ).value =
                address.label || "Home";


            document.getElementById(
                "recipientName"
            ).value =
                address.name || "";


            document.getElementById(
                "phone"
            ).value =
                address.phone || "";


            document.getElementById(
                "pincode"
            ).value =
                address.pincode || "";


            document.getElementById(
                "addressLine"
            ).value =
                address.address || "";


            document.getElementById(
                "city"
            ).value =
                address.city || "";


            document.getElementById(
                "state"
            ).value =
                address.state || "";


            document.getElementById(
                "isDefault"
            ).checked =
                Boolean(address.isDefault);

        }


        modal.classList.add(
            "show"
        );

    }


    function closeModal() {

        modal.classList.remove(
            "show"
        );

        addressForm.reset();

    }


    document
        .getElementById("addAddressBtn")
        .addEventListener(
            "click",
            function () {

                openModal();

            }
        );


    document
        .getElementById("closeModalBtn")
        .addEventListener(
            "click",
            closeModal
        );


    document
        .getElementById("cancelModalBtn")
        .addEventListener(
            "click",
            closeModal
        );


    modal.addEventListener(
        "click",
        function (event) {

            if (
                event.target === modal
            ) {

                closeModal();

            }

        }
    );


    /* ================================
       Save Address
    ================================= */

    addressForm.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();


            const addresses =
                getAddresses();


            const addressId =
                document.getElementById(
                    "addressId"
                ).value;


            const name =
                document.getElementById(
                    "recipientName"
                ).value.trim();


            const phone =
                document.getElementById(
                    "phone"
                ).value.trim();


            const pincode =
                document.getElementById(
                    "pincode"
                ).value.trim();


            const addressLine =
                document.getElementById(
                    "addressLine"
                ).value.trim();


            const city =
                document.getElementById(
                    "city"
                ).value.trim();


            const state =
                document.getElementById(
                    "state"
                ).value.trim();


            const label =
                document.getElementById(
                    "addressLabel"
                ).value;


            const isDefault =
                document.getElementById(
                    "isDefault"
                ).checked;


            if (
                !/^[0-9+\-\s]{10,15}$/.test(
                    phone
                )
            ) {

                showToast(
                    "Please enter a valid phone number."
                );

                return;

            }


            if (
                !/^[0-9]{6}$/.test(
                    pincode
                )
            ) {

                showToast(
                    "PIN code must contain 6 digits."
                );

                return;

            }


            if (isDefault) {

                addresses.forEach(
                    function (item) {

                        item.isDefault =
                            false;

                    }
                );

            }


            const addressData = {

                id:
                    addressId
                        ? Number(addressId)
                        : Date.now(),

                label,

                name,

                phone,

                pincode,

                address:
                    addressLine,

                city,

                state,

                isDefault

            };


            if (addressId) {

                const index =
                    addresses.findIndex(
                        function (item) {

                            return Number(item.id) ===
                                Number(addressId);

                        }
                    );


                if (index !== -1) {

                    addresses[index] =
                        addressData;

                }

                showToast(
                    "Address updated successfully."
                );

            } else {

                if (
                    addresses.length === 0
                ) {

                    addressData.isDefault =
                        true;

                }

                addresses.push(
                    addressData
                );

                showToast(
                    "Address added successfully."
                );

            }

            if (window.ShopSphereApi && window.ShopSphereAuth && window.ShopSphereAuth.isBuyer()) {
                try {
                    const api = window.ShopSphereApi;
                    if (addressId) {
                        api.buyer.updateAddress(addressId, {
                            fullName: name,
                            phone: phone,
                            addressLine: addressLine,
                            city: city,
                            state: state,
                            pincode: pincode,
                            defaultAddress: isDefault
                        }).catch(() => {});
                    } else {
                        api.buyer.addAddress({
                            fullName: name,
                            phone: phone,
                            addressLine: addressLine,
                            city: city,
                            state: state,
                            pincode: pincode,
                            defaultAddress: isDefault
                        }).catch(() => {});
                    }
                } catch(e) {}
            }

            saveAddresses(
                addresses
            );


            renderAddresses();

            closeModal();

        }
    );


    /* ================================
       Address Actions
    ================================= */

    addressGrid.addEventListener(
        "click",
        function (event) {

            const button =
                event.target.closest(
                    "button"
                );


            if (!button) return;


            const id =
                Number(
                    button.dataset.id
                );


            const addresses =
                getAddresses();


            const index =
                addresses.findIndex(
                    function (item) {

                        return Number(item.id) ===
                            id;

                    }
                );


            if (index === -1) {
                return;
            }


            /* Edit */

            if (
                button.classList.contains(
                    "edit-address"
                )
            ) {

                openModal(
                    addresses[index]
                );

                return;

            }


            /* Make Default */

            if (
                button.classList.contains(
                    "make-default"
                )
            ) {

                addresses.forEach(
                    function (item) {

                        item.isDefault =
                            Number(item.id) === id;

                    }
                );


                saveAddresses(
                    addresses
                );


                renderAddresses();


                showToast(
                    "Default address updated."
                );


                return;

            }


            /* Delete */

            if (
                button.classList.contains(
                    "delete-address"
                )
            ) {

                const confirmed =
                    confirm(
                        "Are you sure you want to delete this address?"
                    );


                if (!confirmed) {
                    return;
                }


                const wasDefault =
                    Boolean(
                        addresses[index]
                            .isDefault
                    );


                if (window.ShopSphereApi && window.ShopSphereAuth && window.ShopSphereAuth.isBuyer()) {
                    try {
                        window.ShopSphereApi.buyer.deleteAddress(id).catch(() => {});
                    } catch(e) {}
                }

                addresses.splice(
                    index,
                    1
                );


                if (
                    wasDefault &&
                    addresses.length
                ) {

                    addresses[0]
                        .isDefault =
                        true;

                }


                saveAddresses(
                    addresses
                );


                renderAddresses();


                showToast(
                    "Address deleted."
                );

            }

        }
    );


    /* ================================
       Logout
    ================================= */

    function logout() {

        if (
            window.ShopSphereAuth &&
            typeof window.ShopSphereAuth.logout ===
                "function"
        ) {

            window.ShopSphereAuth.logout();

            return;

        }


        localStorage.removeItem(
            AUTH_KEY
        );


        window.location.href =
            "../login.html";

    }


    document
        .getElementById("logoutBtn")
        .addEventListener(
            "click",
            logout
        );


    /* ================================
       Header Avatar
    ================================= */

    function loadAvatar() {

        const user =
            getUser();


        if (!user) {
            return;
        }


        const name =
            user.name ||
            `${user.firstName || ""} ${
                user.lastName || ""
            }`.trim() ||
            "User";


        document.getElementById(
            "headerAvatar"
        ).textContent =
            name
                .charAt(0)
                .toUpperCase();

    }


    /* ================================
       Initialize
    ================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            loadAvatar();

            renderAddresses();

        }
    );

</script>

</body>
